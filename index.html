<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Português - 9º Ano</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #f8fafc; }
        .quiz-container { background-color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; font-weight: 700; }
        .question { font-size: 18px; font-weight: 600; margin-bottom: 25px; color: #e2e8f0; text-align: left; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        button { background-color: #334155; border: 1px solid #475569; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s; color: #f1f5f9; }
        button:hover { background-color: #0284c7; border-color: #38bdf8; }
        .score-screen { display: none; }
        .score-text { font-size: 22px; font-weight: bold; color: #4ade80; margin: 20px 0; }
        .reset-btn { background-color: #0284c7; color: white; border: none; text-align: center; font-weight: bold; width: 100%; }
        .reset-btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <h1>📝 Quiz de Português - 9º Ano</h1>
        <div class="question" id="question-text">Carregando pergunta...</div>
        <div class="options" id="options-container"></div>
    </div>
    
    <div id="score-box" class="score-screen">
        <h1>📊 Resultado Final</h1>
        <p class="score-text" id="score-result"></p>
        <button class="reset-btn" onclick="restartQuiz()">Tentar Novamente</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Na frase 'Desejo que você seja muito feliz', qual a classificação da oração destacada?",
            o: ["Substantiva Objetiva Direta", "Substantiva Subjetiva", "Adjetiva Restritiva", "Adverbial Final"],
            a: 0
        },
        {
            q: "Qual figura de linguagem está presente em: 'O vento beijou meu rosto suavemente'?",
            o: ["Metáfora", "Hipérbole", "Personificação (Prosopopeia)", "Antítese"],
            a: 2
        },
        {
            q: "Assinale a alternativa que apresenta o uso CORRETO da crase:",
            o: ["Entreguei o presente à meu irmão.", "Fui à farmácia comprar os remédios.", "Voltei de pressa para assistir à uma série.", "Prefiro caminhar a correr no parque."],
            a: 1
        },
        {
            q: "Identifique a regência CORRETA do verbo assistir (no sentido de presenciar):",
            o: ["Assistimos o espetáculo com emoção.", "Assistimos ao concerto de música clássica.", "Assistimos em um belo show de rock.", "Assistimos o desfile na avenida."],
            a: 1
        }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        if(currentQ >= quizData.length) {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('score-box').style.display = 'block';
            document.getElementById('score-result').innerText = `Você acertou ${score} de ${quizData.length} questões!`;
            return;
        }
        
        let data = quizData[currentQ];
        document.getElementById('question-text').innerText = `${currentQ + 1}. ${data.q}`;
        let optionsHtml = '';
        data.o.forEach((opt, index) => {
            optionsHtml += `<button onclick="checkAnswer(${index})">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

    function checkAnswer(selected) {
        if(selected === quizData[currentQ].a) { score++; }
        currentQ++;
        loadQuestion();
    }

    function restartQuiz() {
        score = 0;
        currentQ = 0;
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('score-box').style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
